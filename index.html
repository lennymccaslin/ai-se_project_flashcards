<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Lenin McCaslin" />
    <meta
      name="description"
      content="An app/website that students can use to create multiple of their own flashcard decks for any studyable subject"
    />
    <meta
      name="keywords"
      content="flashcard, study, learning tools, education resources, create your own"
    />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Flashcard Study Table</title>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li class="nav__item">
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="gallery" id="deck-view">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button
            type="button"
            class="gallery__practice-btn"
            aria-label="practice deck"
          >
            Practice
          </button>
        </div>
        <ul class="gallery__list">
          <template id="card-template">
            <li class="card card_color_green">
              <h3 class="card__title"></h3>
              <div class="card__row">
                <button
                  type="button"
                  class="card__flip-btn"
                  aria-label="flip card"
                >
                  <img src="./assets/images/flip.svg" alt="flip card button" />
                </button>
                <button
                  type="button"
                  class="card__delete-btn"
                  aria-label="delete card"
                >
                  <img
                    src="./assets/images/delete.svg"
                    alt="delete deck button"
                  />
                </button>
              </div>
            </li>
          </template>
          <li>
            <button
              type="button"
              class="gallery__new-flashcard-btn"
              aria-label="new card"
            >
              + New Card
            </button>
          </li>
        </ul>
      </section>
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>
        <ul class="gallery__list">
          <template id="gallery-template">
            <li class="card card_color_green">
              <a class="card__link" href="#carousel"></a>
              <h3 class="card__title"></h3>
              <div class="card__row">
                <p class="card__count"></p>
                <button
                  type="button"
                  class="card__delete-btn"
                  aria-label="delete deck"
                >
                  <img
                    src="./assets/images/delete.svg"
                    alt="delete deck button"
                  />
                </button>
              </div>
            </li>
          </template>
          <li>
            <button
              type="button"
              class="gallery__new-card-btn"
              aria-label="new deck"
            >
              + New Deck
            </button>
          </li>
        </ul>
      </section>
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="go to previous card in deck"
            class="carousel__btn carousel__btn_disabled carousel__btn_type_left"
          ></button>
          <div class="carousel__card">
            <h3 class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</h3>
          </div>
          <button
            type="button"
            aria-label="go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="flip card to other side"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>
      <section id="not-found" class="not-found">
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">Oops! We can't find that.</p>
      </section>
      <section id="new-deck-view" class="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-view-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>
            <label class="new-deck-view__color-label" for="green">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_green"
                aria-label="Green"
                name="color"
                id="green"
                value="#64D583"
                type="radio"
                checked
              />
            </label>
            <label class="new-deck-view__color-label" for="blue">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                aria-label="Blue"
                name="color"
                id="blue"
                value="#91A8F9"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="purple">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                aria-label="Purple"
                name="color"
                id="purple"
                value="#AA8EF0"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="pink">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                aria-label="Pink"
                name="color"
                id="pink"
                value="#EE92D7"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="orange">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                aria-label="Orange"
                name="color"
                id="orange"
                value="#EE955E"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="yellow">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                aria-label="Yellow"
                name="color"
                id="yellow"
                value="#F5D770"
                type="radio"
              />
            </label>
          </fieldset>
          <fieldset
            class="new-deck-view__text-area"
            id="new-deck-view__text-area"
          >
            <label
              class="new-deck-view__text-area_label"
              for="new-deck-view__text-area-input"
            >
              Write the Json
              <textarea
                class="new-deck-view__text-area_input"
                id="new-deck-view__text-area-input"
                aria-label="Text area input"
                name="data-json"
                required
                minlength="1"
              ></textarea>
            </label>
          </fieldset>
          <button
            type="submit"
            class="new-deck-view__submit-btn"
            id="new-deck-view__submit-btn"
          >
            Create the Deck
          </button>
        </form>
      </section>
      <div class="modal" id="confirm-modal">
        <div class="modal__container">
          <p class="modal__message">Are you sure you want to delete this?</p>
          <div class="modal__buttons">
            <button type="button" class="modal__cancel-btn">Cancel</button>
            <button type="button" class="modal__confirm-btn">Delete</button>
          </div>
        </div>
      </div>
      <div class="modal" id="error-modal">
        <div class="modal__container">
          <h2 class="modal__title">An error has occurred</h2>
          <p class="modal__error"></p>
          <button class="modal__close" type="button">Dismiss</button>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Lenin McCaslin</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
